# Local Kafka broker for Phase 8 (real-time streaming).
#
# Uses Apache Kafka's own official image in KRaft mode — no separate
# Zookeeper service needed (KRaft replaced Zookeeper as of Kafka 3.x),
# which keeps this to a single container instead of two.
#
# *** Not tested in the development sandbox this project was built in
# — no Docker available there. Written against Apache Kafka's
# documented KRaft quick-start configuration; run it yourself with:
#     docker compose up -d
# then confirm it's healthy with:
#     docker compose ps
# ***
#
# Once running, the broker is reachable at localhost:9092 — matching
# the default `bootstrap_servers` in src/streaming/kafka_broker.py.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: upi-fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
